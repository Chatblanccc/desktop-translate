name: Phase 1 Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject whitespace errors
        run: git diff-tree --check --no-commit-id --root -r -m HEAD

      - name: Verify Phase 1
        run: pnpm phase1:verify
